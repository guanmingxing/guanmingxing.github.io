{{ define "main" }}
<article class="post">
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        {{ if .Date }}
        <time class="post-date">{{ .Date.Format "2006年1月2日" }}</time>
        {{ end }}
    </header>
    <div class="post-content">
        {{ .Content }}
    </div>
</article>
{{ end }}
