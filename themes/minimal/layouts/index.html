{{ define "main" }}
<section class="home">
    <h2>最新文章</h2>
    <ul class="post-list">
        {{ range first 10 (where .Site.RegularPages "Section" "posts") }}
        <li>
            <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
