baseURL = 'https://guanmingxing.github.io/'
defaultContentLanguage = 'zh-cn'
title = 'Robot & Chip'
theme = 'PaperMod'
enableRobotsTXT = true

[languages]
  [languages.zh-cn]
    locale = 'zh-CN'
    label = '简体中文'
    weight = 1

[params]
  author = "GMX"
  description = "聚焦机器人、芯片、计算机技术"
  mainSections = ["posts", "ais"]

[params.profileMode]
  enabled = true
  title = "Robot & Chip"          # 大标题（不填则用 site.Title）
  subtitle = "聚焦机器人、芯片、计算机技术"  # 副标题，支持 Markdown
  imageUrl = "/profile/yuanbao.jpg"       # 头像图片路径（放在 assets/ 或 static/ 下）
  imageTitle = "头像"             # 头像标题/alt 文本
  imageWidth = 150               # 头像宽度
  imageHeight = 150              # 头像高度

  # 社交图标（配置在 params.socialIcons 中，这里也会显示）
  # ...

  # 按钮
  [[params.profileMode.buttons]]
    name = "归档"
    url = "/archives/"
  [[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/guanmingxing"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "机器人"
    url = "/robots/"
    weight = 2
  [[menu.main]]
    name = "芯片"
    url = "/chips/"
    weight = 3
  [[menu.main]]
    name = "计算机系统"
    url = "/system/"
    weight = 4
  [[menu.main]]
    name = "碎碎念"
    url = "/posts/"
    weight = 5
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 6

[markup]
  [markup.goldmark.renderer]
    unsafe = true
