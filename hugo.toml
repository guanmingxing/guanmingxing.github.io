baseURL = 'https://guanmingxing.github.io/'
defaultContentLanguage = 'zh-cn'
title = 'GMX的个人博客'
theme = 'PaperMod'
enableRobotsTXT = true

[languages]
  [languages.zh-cn]
    locale = 'zh-CN'
    label = '简体中文'
    weight = 1

[params]
  author = "GMX"
  description = "一个关于技术、生活和思考的个人博客"
  mainSections = ["posts", "ais"]

[params.profileMode]
  enabled = true
  title = "GMX的小世界"          # 大标题（不填则用 site.Title）
  subtitle = "一个关于技术、生活和思考的个人博客"  # 副标题，支持 Markdown
  imageUrl = "/profile/yuanbao.jpg"       # 头像图片路径（放在 assets/ 或 static/ 下）
  imageTitle = "头像"             # 头像标题/alt 文本
  imageWidth = 150               # 头像宽度
  imageHeight = 150              # 头像高度

  # 社交图标（配置在 params.socialIcons 中，这里也会显示）
  # ...

  # 按钮
  [[params.profileMode.buttons]]
    name = "归档"
    url = "/archives/"
  [[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/guanmingxing"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "AI"
    url = "/ais/"
    weight = 3
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 4

[markup]
  [markup.goldmark.renderer]
    unsafe = true
